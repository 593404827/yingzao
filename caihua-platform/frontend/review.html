<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老师意见 · 复核记录</title><link rel="stylesheet" href="/style.css"><style>body{padding:35px;max-width:1200px;margin:auto}section{background:#faf8f1;border:1px solid #dddcd0;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}h1{font-family:serif}input{padding:12px;width:100%;border:1px solid #bbb}pre{white-space:pre-wrap;font:12px sans-serif;line-height:1.8}details{border-bottom:1px solid #ddd;padding:12px 0}summary{cursor:pointer}.tag{font-size:11px;color:#9c513a}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><a href="/">← 回到知识图谱</a><h1>老师意见与知识修订</h1><p id="note"></p><h2>本轮具体核对</h2><div class="grid" id="checks"></div><h2>229 项历史问题回查索引</h2><p>显示历史审核意见和当前条目收录状态；条目计数不等于问题已被专家重新确认。</p><input id="filter" placeholder="搜索：赭笔、五彩、尺寸、Q049、CH-028…" aria-label="搜索复核问题"><div id="issues"></div><h2>修订历史（保留前后值）</h2><div id="history"></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/reviews').then(r=>r.json()).then(d=>{document.querySelector('#note').textContent=d.note;document.querySelector('#checks').innerHTML=d.checks.map(x=>`<section><span class="tag">${esc(x.result)}</span><h3>${esc(x.topic)}</h3><p>${esc(x.previous)}</p><pre>${esc(x.current)}</pre><p>${esc(x.reason)}</p></section>`).join('');let render=()=>{let q=document.querySelector('#filter').value;document.querySelector('#issues').innerHTML=d.historical_issues.filter(x=>JSON.stringify(x).includes(q)).map(x=>`<details><summary>${esc(x.id)} · ${esc(x.sid)} · ${esc(x.historical_status)} · ${esc(x.question.slice(0,60))}</summary><p>${esc(x.question)}</p><p>${esc(x.previous_decision)}</p><p>当前条目：${x.current_entity_count} 个实体，${x.current_relation_count} 条关系，其中 ${x.current_pending_relation_count} 条待确认。</p></details>`).join('')};document.querySelector('#filter').oninput=render;render()});fetch('/api/history').then(r=>r.json()).then(rows=>{document.querySelector('#history').innerHTML=rows.map(x=>`<details><summary>#${x.seq} ${esc(x.reason)}</summary><pre>${esc(JSON.stringify({at:x.at,id:x.id,before:x.before,after:x.after},null,2))}</pre></details>`).join('')});</script></html>
