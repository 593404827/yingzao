<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>彩画作 · 知识探索</title><link rel="stylesheet" href="/style.css">
<header><div class="brand"><div class="seal">彩</div><div><h1>彩画作 · 知识探索</h1><small>YINGZAO FASHI · KNOWLEDGE ATLAS</small></div></div><div class="note">从原典出发，让知识之间的联系可见。</div><div class="status" id="connection">全文数据快照</div></header>
<div class="shell"><aside><div class="intro"><div class="eyebrow">READ · CONNECT · VERIFY</div><h2>循着知识，读懂彩画</h2><div class="muted">探索制度、纹样、设色与工艺。<br>每一条联系，都能返回它的文字依据。</div></div><form class="search" id="searchForm"><input id="search" aria-label="检索实体或知识" placeholder="输入术语或选择下方问题"><button aria-label="搜索">↗</button></form><div class="example">试试：五彩遍装、碾玉装、丹粉刷饰</div><h3>从一个问题开始</h3><div class="presets" id="presets"></div><h3>知识类别</h3><div class="legend" id="legend"></div><div class="stats" id="stats"></div><div class="notice">全文候选完整展示，审核状态分层。待确认内容默认不参与问题回答，仍可在原文与审核记录中查看。</div></aside>
<main><div class="toolbar"><strong id="viewTitle">全局知识图谱</strong><div class="controls"><a href="/review" target="_blank" style="font-size:11px;color:#a4553d;padding:7px;text-decoration:none">复核记录 ↗</a><select id="statusFilter" aria-label="审核状态筛选"><option value="all">候选 + 已核验</option><option value="verified">仅已核验</option><option value="pending">包含待确认</option></select><button id="global">全局</button><button id="fit">适应视图</button></div></div><div class="graph-wrap"><canvas id="canvas" aria-label="知识图谱交互画布"></canvas><div class="graph-caption" id="caption"></div><div class="graph-bottom">拖动画布 · 滚轮缩放 · 点击实体查看属性与依据</div><div class="zoom"><button id="minus" aria-label="缩小">−</button><button id="plus" aria-label="放大">+</button></div></div><section class="answer" id="answer"></section></main>
<section class="right" id="detail"></section></div><dialog id="sourceDialog"><button class="close" onclick="this.closest('dialog').close()" aria-label="关闭">×</button><div id="sourceContent"></div></dialog>
<script>fetch('/api/graph').then(r=>{if(!r.ok)throw new Error('数据加载失败');return r.json()}).then(g=>{window.__CAIHUA_DATA__=g;let s=document.createElement('script');s.src='/app.js';document.body.appendChild(s)}).catch(e=>{document.querySelector('#connection').textContent=e.message});</script></html>
